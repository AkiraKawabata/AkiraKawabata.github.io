<section class="section" aria-labelledby="awards-title">
  <h2 id="awards-title">Honors and scholarships</h2>
  <ul class="rows">
    {% for a in site.data.home.awards %}
    <li class="row">
      <span class="when">{{ a.year }}</span>
      <span>{{ a.body }}</span>
    </li>
    {% endfor %}
  </ul>
</section>
